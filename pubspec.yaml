name: tasky
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  hive: any
  hive_flutter: any
  http: any
  flutter_svg: any
  google_fonts : any
  crypto: any
  image_picker : any
  intl_phone_field : any
  qr_flutter : any
  flutter_bloc : any
  mobile_scanner: 7.0.1
  dartz : any
  dotted_border : ^2.0.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  intl : any
  shimmer: ^3.0.0
  flutter_launcher_icons: ^0.13.1  


flutter_icons:
  android: true
  ios: true
  image_path: "assets/ICON.png"



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  hive_generator: any
  build_runner: any

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Varela
      fonts:
        - asset: assets/fonts/VarelaRound-Regular.ttf
